name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%23161B22,%23332B00,%23665500,%23CCAA00,%23FFE066

            dist/github-snake.svg?color_snake=%23E6B800&color_dots=%23ebedf0,%23FFF7AE,%23FFE066,%23FFD700,%23CCAA00

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
