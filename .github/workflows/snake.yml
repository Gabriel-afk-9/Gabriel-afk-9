name: Generate Snake

on:
  schedule:
    # Executa a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4 # Usar a versão mais recente do checkout

      - name: Criar diretório 'dist' (se não existir)
        run: mkdir -p dist

      - name: Gerar animação da cobrinha
        uses: Platane/snk@v3.5.0 # Usar a versão específica da ação snk
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
             dist/github-snake-dark.svg?palette=github-dark&color_snake=%%23F7E733
             dist/github-snake.svg?color_snake=%23%23F7E733


      - name: Deploy para GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3.1.0 # Usar uma versão mais recente da ação ghaction-github-pages
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
